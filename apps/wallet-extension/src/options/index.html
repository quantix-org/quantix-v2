<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantix Wallet Settings</title>
  <style>
    :root {
      --bg: #071321;
      --bg-2: #0f2537;
      --panel: rgba(15, 28, 46, 0.84);
      --line: rgba(143, 183, 224, 0.25);
      --text: #e9f4ff;
      --muted: #9db6cf;
      --ok: #22c55e;
      --err: #ef4444;
      --primary: #0ea5a8;
      --primary-h: #0b8a8f;
      --motion-fast: 120ms;
      --motion-med: 220ms;
      --motion-slow: 420ms;
    }
    body {
      font-family: "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
      max-width: 760px;
      margin: 24px auto;
      padding: 0 16px 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 10% -5%, rgba(14, 165, 168, 0.28), transparent 38%),
        radial-gradient(circle at 95% 15%, rgba(245, 158, 11, 0.17), transparent 30%),
        linear-gradient(165deg, var(--bg), var(--bg-2));
      min-height: 100vh;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(5px);
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.46);
      opacity: 0;
      transform: translateY(8px) scale(0.995);
      animation: panel-enter var(--motion-slow) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    h1 {
      margin: 2px 0 6px;
      font-size: 22px;
      letter-spacing: 0.3px;
    }
    .muted {
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 13px 0 6px;
      font-size: 12px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #c7ddf5;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(5, 16, 29, 0.78);
      color: var(--text);
      padding: 10px;
      font-family: "IBM Plex Mono", "Menlo", monospace;
      border-radius: 9px;
      font-size: 12px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    input:focus {
      outline: none;
      border-color: rgba(14, 165, 168, 0.9);
      box-shadow: 0 0 0 2px rgba(14, 165, 168, 0.22);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(45, 68, 98, 0.9), rgba(27, 45, 70, 0.9));
      color: var(--text);
      padding: 9px 13px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: transform 100ms ease, filter 120ms ease;
    }
    button:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }
    button:active { transform: translateY(1px); }
    #save {
      background: linear-gradient(180deg, var(--primary), var(--primary-h));
      border-color: rgba(15, 120, 124, 0.95);
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .ok {
      margin-top: 10px;
      color: var(--ok);
      font-size: 13px;
      font-weight: 700;
    }
    .err {
      margin-top: 10px;
      color: var(--err);
      font-size: 13px;
      font-weight: 700;
    }

    @keyframes panel-enter {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.995);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .panel {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Quantix Wallet Settings</h1>
    <div class="muted">Configure active account and RPC endpoint for Quantix dApp communication.</div>

    <label for="active-address">Active address (qtx1...)</label>
    <input id="active-address" placeholder="qtx1..." />

    <label for="rpc-endpoint">RPC endpoint</label>
    <input id="rpc-endpoint" placeholder="https://rpc1.qpqb.org" />

    <div class="row">
      <button id="save">Save</button>
    </div>

    <label for="wallet-json">Import wallet JSON (optional)</label>
    <input id="wallet-json" placeholder='{"version":"quantix-key/v1", ...}' />

    <div class="row">
      <button id="import-wallet">Import Wallet</button>
    </div>

    <div id="status"></div>

    <div class="hint">Temporary MVP storage only. Secure vault and approval UI will replace this path.</div>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
